name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Test TUI
        run: bun run test:tui

      - name: Build
        run: bun run build

      - name: Compile standalone binary
        run: bun run build:binary

      - name: Test compiled IaC evaluator
        run: node --import tsx --test src/commands/config.e2e.test.ts
        env:
          UBCTL_TEST_BINARY: ${{ github.workspace }}/out/ubctl
